[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "label-pair-diff"
version = "0.1.1"
description = "Content-safe comparison of categorical labels paired by exact ID"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Hardik-S contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
label-pair-diff = "label_pair_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
